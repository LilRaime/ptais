name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  style:
    name: Code Style & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: pip install ruff

      - name: Lint with Ruff
        run: ruff check .

      - name: Validate Python Syntax
        run: python -m compileall -q -x "[\\/]\.venv" lab1 lab2 lab3 lab4 rgr

  build:
    name: Package Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: pip install build

      - name: Build Wheel and Source Dist
        run: python -m build

      - name: Verify Distribution Artifacts
        run: ls -lh dist/
