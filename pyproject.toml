[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptais"
version = "1.0.0"
description = "Programming Technologies for Artificial Intelligence Systems (PTAIS) - Laboratories & RGR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LilRaime" }
]
keywords = [
    "deep-learning",
    "computer-vision",
    "onnx",
    "onnxruntime",
    "openvino",
    "quantization",
    "pytorch"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=9.0.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "onnx>=1.14.0",
    "onnxscript>=0.1.0",
    "onnxruntime>=1.16.0",
    "openvino>=2023.2.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "build>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lab*", "rgr*"]
exclude = ["plots*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E701",
    "E702",
    "F401",
    "W292",
    "W293",
]
